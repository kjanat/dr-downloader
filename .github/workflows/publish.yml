# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish to npm
run-name: ${{ inputs.retag != '' && format('Retag latest → {0}', inputs.retag) || format('Publish ({0})', github.ref_name) }}
on:
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      dry-run: { description: "Build and pack, but do not publish", type: boolean, default: true }
      retag: { description: "Move 'latest' to this published version (e.g. 1.0.0-alpha.3); skips publish", type: string, default: "" }

concurrency: { group: "publish-${{ github.ref }}", cancel-in-progress: false }
permissions: { contents: read }
defaults: { run: { shell: pwsh } }

jobs:
  publish:
    if: inputs.retag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, id-token: write }
    environment: { name: npm, url: "${{ steps.meta.outputs.url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the published package URL
        id: meta
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json;
          $tag = if ( $pkg.version -match '-([0-9A-Za-z]+)' ) { $Matches[1] } else { 'latest' }
          'url=https://npm.im/package/{0}/v/{1}' -f $pkg.name, $pkg.version >> $env:GITHUB_OUTPUT
          'VERSION={0}' -f $pkg.version >> $env:GITHUB_ENV
          'NPM_TAG={0}' -f $tag >> $env:GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: canary }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: kjanat/runner@d166c6d1b70147ed7c4a2fdb0e4ed5ed8d2e4d39 # master
      - name: Install deps (skip the Chrome postinstall)
        run: bun install --frozen-lockfile --ignore-scripts
      - run: run -s typecheck lint test build
      - name: Verify package.json version matches the release tag
        if: github.event_name == 'release'
        run: |
          $pkgVersion = $env:VERSION; $tag = $env:GITHUB_REF_NAME.TrimStart('v');
          if ( $pkgVersion -ne $tag ) {
            "::error file=package.json,title=Version mismatch::package.json version ($pkgVersion) != release tag ($tag)";
            Exit 1
          }
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run --access public --tag $env:NPM_TAG
      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: npm publish --provenance --access public --tag $env:NPM_TAG

  retag:
    if: github.event_name == 'workflow_dispatch' && inputs.retag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    environment: npm
    env: { RETAG: "${{ inputs.retag }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Move latest
        run: npm dist-tag add "$((Get-Content package.json | ConvertFrom-Json).name)@$env:RETAG" latest
